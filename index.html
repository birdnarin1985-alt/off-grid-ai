<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Off Grid AI - Custom Core Emulator</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0d0d0e;
            --border-color: #1a1a1c;
            --accent-color: #0df396; /* สีเขียวมินต์สะท้อนแสงตามภาพ */
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --text-dark: #3a3a3c;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* จำลองกรอบหน้าจอ iPad/iPhone เพื่อความเป๊ะ */
        .app-shell {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 24px 16px 90px 16px; /* เว้นด้านล่างให้ Bottom Nav */
        }

        /* --- HEADER AREA --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background-color: #000;
            border: 2px solid var(--accent-color);
            border-radius: 6px;
            position: relative;
        }
        .brand-icon::after {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .crown-btn {
            width: 38px;
            height: 38px;
            background-color: rgba(13, 243, 150, 0.1);
            border: 1px solid rgba(13, 243, 150, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--accent-color);
            cursor: pointer;
        }

        /* --- MODELS CARD --- */
        .models-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .models-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            text-transform: uppercase;
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
        }

        .model-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .model-icon-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 18px;
            font-weight: 500;
        }

        .model-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .disabled-item {
            color: var(--text-dark);
        }
        .disabled-item .model-label {
            color: var(--text-dark);
        }

        /* --- NEW CHAT BUTTON --- */
        .btn-new-chat {
            width: 100%;
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            margin-bottom: 16px;
            transition: background-color 0.2s;
        }
        .btn-new-chat:active {
            background-color: rgba(13, 243, 150, 0.05);
        }

        /* --- SYNC WITH PRO CARD --- */
        .pro-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .pro-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .pro-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .btn-get-pro {
            width: 100%;
            background-color: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .btn-get-pro:active {
            background-color: rgba(255,255,255,0.08);
        }

        /* --- RECENT SECTION --- */
        .recent-section {
            padding: 0 4px;
            margin-bottom: 20px;
        }

        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .recent-title {
            font-size: 16px;
            font-weight: 600;
        }

        .see-all {
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
        }

        .recent-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .recent-left h4 {
            margin: 0 0 6px 0;
            font-size: 16px;
            font-weight: 500;
        }

        .recent-left p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        .recent-right {
            color: var(--text-muted);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        /* --- LIVE TERMINAL MONITOR (ระบบซ่อนในปุ่มแอบเปิดเพื่อคงความเป็นระเบียบ) --- */
        .telemetry-box {
            background-color: #050505;
            border-radius: 10px;
            border: 1px dashed var(--border-color);
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: var(--accent-color);
            margin-top: 16px;
            height: 100px;
            overflow-y: auto;
        }

        /* --- BOTTOM NAVIGATION BAR --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background-color: rgba(13, 13, 14, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            padding: 8px 0 20px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-icon {
            font-size: 20px;
            line-height: 1;
        }
    </style>
</head>
<body>

<div class="app-shell">
    
    <!-- HEADER -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon"></div>
            <span>Off Grid AI</span>
        </div>
        <div class="crown-btn" onclick="triggerSystemError('PRO_UPGRADE_CLICK')">👑</div>
    </div>

    <!-- MODELS CARD -->
    <div class="models-card">
        <div class="models-header">
            <span>Models</span>
            <span>▼</span>
        </div>
        <div class="models-grid">
            <div class="model-item" onclick="selectModel('Text')">
                <div class="model-icon-row" style="color: var(--accent-color);">💬 <span>1</span></div>
                <div class="model-label">Text</div>
            </div>
            <div class="model-item" onclick="selectModel('Image')">
                <div class="model-icon-row" style="color: var(--accent-color);">🖼️ <span>1</span></div>
                <div class="model-label">Image</div>
            </div>
            <div class="model-item disabled-item" onclick="triggerSystemError('VOICE_NOT_INITIALIZED')">
                <div class="model-icon-row">🔊 <span>0</span></div>
