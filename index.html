<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OFF-GRID AI CORE v1.2</title>
    <style>
        /* ล็อกทุกองค์ประกอบกายภาพเพื่อเสถียรภาพระดับ Native App */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background-color: #080810;
            color: #00ffcc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. แถบหัวแอปหลัก (Native Navigation / Title Bar) */
        header {
            height: 50px;
            background: #0f101e;
            border-bottom: 1px solid #1f2340;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .system-status {
            font-size: 12px;
            background: rgba(0, 255, 204, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            text-shadow: 0 0 4px #00ffcc;
        }

        /* ส่วนจัดวางเนื้อหาหลักแบบแบ่งพื้นที่ (Split View Layout) */
        .app-workspace {
            flex: 1;
            display: flex;
            width: 100vw;
            height: calc(100vh - 170px); /* หักความสูงหัวและท้ายแอป */
        }

        /* 2. แถบสถานะด้านข้าง (Sidebar Panel) */
        .sidebar {
            width: 180px;
            background: #0b0c16;
            border-right: 1px solid #1f2340;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
        }

        .stat-box {
            background: #121424;
            border: 1px solid #1f2340;
            padding: 10px;
            border-radius: 6px;
            font-size: 11px;
        }

        .stat-label { color: #8892b0; margin-bottom: 4px; }
        .stat-value { font-family: monospace; font-size: 14px; font-weight: bold; color: #ff007f; }

        /* พื้นที่แสดงผลการจำลองหลัก (Simulation & Console Container) */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #020205;
        }

        /* 3. แถบหน้าต่างแสดงผล 3D Voxel Viewport */
        .voxel-viewport {
            height: 55%;
            border-bottom: 1px solid #1f2340;
            position: relative;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ตารางพิกเซล Voxel Console Matrix */
        .voxel-grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(16, 1fr);
            width: 280px;
            height: 280px;
            gap: 1px;
            background: #0a0a14;
            border: 2px solid #1f2340;
            padding: 2px;
            box-shadow: 0 0 20px rgba(0,255,204,0.1);
        }

        .voxel-cell {
            background: #05050a;
            border-radius: 1px;
            transition: background 0.05s ease;
        }

        /* 4. แถบหน้าต่างรายงานสถานะลอจิก (Console Log Panel) */
        .console-log {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
            background: #040408;
            color: #a0aec0;
        }

        .log-entry { margin-bottom: 5px; padding-left: 8px; border-left: 2px solid #ff007f; }
        .log-success { border-left-color: #00ffcc; color: #00ffcc; }

        /* 5. แถบควบคุมปุ่มกดด้านล่างแอป (Native Form / Action Bar) */
        footer {
            height: 120px;
            background: #0f101e;
            border-top: 1px solid #1f2340;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 10px;
            gap: 10px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
        }

        button {
            background: #16192e;
            border: 1px solid #262b4f;
            color: #00ffcc;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: background 0.1s, transform 0.05s;
        }

        button:active {
            background: #00ffcc;
            color: #090910;
            transform: scale(0.97);
        }

        button.btn-danger { color: #ff007f; border-color: rgba(255,0,127,0.3); }
        button.btn-danger:active { background: #ff007f; color: #fff; }
    </style>
</head>
<body>

    <!-- 1. Native Title Bar -->
    <header>
        <div>🎛️ COGNITIVE SIMULATOR</div>
        <div class="system-status" id="sys-mode">CORE: OFF-GRID</div>
    </header>

    <!-- App Body Split View -->
    <div class="app-workspace">
        
        <!-- 2. Native Sidebar Info -->
        <div class="sidebar">
            <div class="stat-box">
                <div class="stat-label">ACTIVE NODE</div>
                <div class="stat-value" id="lbl-node">0x00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">BIT-WIDTH</div>
                <div class="stat-value">3-BIT REG</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">HW THERMAL</div>
                <div class="stat-value" style="color: #00ffcc;">STABLE (0W)</div>
            </div>
        </div>

        <!-- Main Output Panel -->
        <div class="main-container">
            
            <!-- 3. 3D Voxel Viewport Grid -->
            <div class="voxel-viewport">
                <div class="voxel-grid" id="voxel-matrix"></div>
            </div>

            <!-- 4. Console Log Panel -->
            <div class="console-log" id="app-console">
                <div class="log-entry log-success">[SYSTEM]: ยืนยันสถาปัตยกรรมรูปนามแบบปิดถาวร (Native Frame Initialized)</div>
                <div class="log-entry">[WAITING]: ระบบจอง RAM สำเร็จ คงเหลือรอลดทอนอินพุตผ่านแผงควบคุม...</div>
            </div>
        </div>
    </div>

    <!-- 5. Native Action Bar -->
    <footer>
        <button onclick="simulateVoxelCore(4)"><span>💥 SIGNAL 100b</span><span style="font-size:10px;font-weight:normal;color:#8892b0;">Obstacle Map</span></button>
        <button onclick="simulateVoxelCore(2)"><span>🗣️ SIGNAL 010b</span><span style="font-size:10px;font-weight:normal;color:#8892b0;">Voice Trig</span></button>
        <button onclick="simulateVoxelCore(1)"><span>🔋 SIGNAL 001b</span><span style="font-size:10px;font-weight:normal;color:#8892b0;">Low Power</span></button>
        <button onclick="simulateVoxelCore(0)" class="btn-danger"><span>🛑 CEASE KERNEL</span><span style="font-size:10px;font-weight:normal;color:#fff;opacity:0.6;">Reset Buffer</span></button>
    </footer>

    <script>
        const matrixEl = document.getElementById('voxel-matrix');
        const consoleEl = document.getElementById('app-console');
        const nodeLabel = document.getElementById('lbl-node');

        // จัดการสร้าง Grid Cell ขนาด 16x16 ทิ้งไว้ในเครื่องคอมพิวเตอร์แบบคงรูปถาวร
        const totalCells = 16 * 16;
        for (let i = 0; i < totalCells; i++) {
            const cell = document.createElement('div');
            cell.className = 'voxel-cell';
            cell.id = `cell-${i}`;
            matrixEl.appendChild(cell);
        }

        // ----------------------------------------------------------------------
        // 3D VOXEL SIMULATION CORE (ลอจิกวิเคราะห์พิกเซลโครงสร้างต้นไม้เหตุปัจจัย)

            for (let i = 0; i < totalCells; i++) {
                document.getElementById(`cell-${i}`).style.background = '#05050a';
                document.getElementById(`cell-${i}`).style.boxShadow = 'none';
            }

            let logClass = "";

                logClass = "log-entry";
            } else {
                nodeLabel.innerText = `0x0${signal.toString(16).toUpperCase()}`;
                logClass = "log-entry log-success";
                
                // อัลกอริทึมวาดพิกเซลจำลองเวกเตอร์เคลื่อนไหว 3D Voxel (Simulation Mapping) ตามรหัสบิต
                // โดยคำนวณเส้นดัชนีทางเดียว ไม่สร้างการประมวลผลซ้ำซ้อนในซีพียู
                if (signal === 4) { // เหตุ: สิ่งกีดขวาง -> วาดแนวพิกเซลขวางกั้นความร้อน
                    logMsg = `[ARISING]: อินพุต 100b ตัวคัดกรองตารางความจริงจำแนกเวกเตอร์แนวหลบหลีก (Obstacle Core Route)`;

                        drawVoxel(x, 8, '#ff007f'); // วาดแกนกลางพิกเซล
