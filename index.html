<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Off Grid AI - PRO Absolute Fixed Core</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0d0d0e;
            --border-color: #1a1a1c;
            --accent-color: #0df396; /* เขียวมินต์สะท้อนแสง */
            --pro-gold: #ffd60a;      /* ทองสิทธิ์โปร VIP */
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --toggle-bg: #1c1c1e;
            --input-bg: #151517;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0; padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            /* ขจัดอวิชชาความสูงล้นด้วยการใช้ค่าความสูงที่แสดงผลจริงสูงสุดบนเบราว์เซอร์อุปกรณ์พกพา */
            height: 100%;
            overflow: hidden; 
        }

        /* กรอบแอปพลิเคชันกระชับ ล็อคขนาดให้ปลอดภัย */
        .app-shell {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 16px 12px 0 12px;
        }

        /* --- STAGE VIEWPORT (พื้นที่เนื้อหาด้านบน เปิดสกรอลล์หลบเมนูด้านล่างลื่นๆ) --- */
        .stage-viewport {
            flex: 1;
            overflow-y: auto;
            /* เว้นระยะเผื่อไว้ 110px เพื่อป้องกันไม่ให้กล่องล่างสุดโดนแถบเมนูลอยทับ */
            padding-bottom: 110px; 
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .stage-viewport::-webkit-scrollbar { display: none; }

        .view {
            display: none;
            will-change: opacity;
        }

        .view.active {
            display: block;
        }

        /* --- UI COMPONENTS (กระชับระยะลงเพื่อให้พอดีจอสายตา) --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; }
        .brand-icon { width: 22px; height: 22px; border: 2px solid var(--accent-color); border-radius: 5px; position: relative; }
        .brand-icon::after { content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; background-color: var(--accent-color); border-radius: 1px; }
        .pro-badge { background-color: rgba(13, 243, 150, 0.15); border: 1px solid var(--accent-color); color: var(--accent-color); font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-top: 2px; }
        .crown { color: var(--pro-gold); font-size: 16px; }

        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .card-header-text { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        
        .models-grid { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
        .model-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .model-val { color: var(--accent-color); font-size: 15px; font-weight: bold; font-family: monospace; }
        .model-lbl { font-size: 10px; color: var(--text-muted); }

        .btn-action { width: 100%; background-color: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 10px; text-align: center; }
        .btn-action:active { background-color: rgba(13, 243, 150, 0.05); }

        .recent-item { background-color: rgba(255,255,255,0.01); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .recent-left h4 { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .recent-left p { font-size: 12px; color: var(--text-muted); }

        /* Settings view */
        .back-btn { color: var(--accent-color); cursor: pointer; font-size: 14px; margin-bottom: 10px; display: inline-block; }
        h1 { font-size: 26px; font-weight: 600; margin-bottom: 12px; }
        .slider-row { display: flex; justify-content: space-between; font-size: 13.5px; }
        .slider-ui { width: 100%; -webkit-appearance: none; background: var(--toggle-bg); height: 6px; border-radius: 3px; outline: none; margin: 8px 0; }
        .slider-ui::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; cursor: pointer; }

        .segment-control { background-color: var(--toggle-bg); padding: 2px; border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
        .segment-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .segment-btn.active { background-color: var(--accent-color); color: #000000; }

        /* Chat Window View */
        .chat-container { height: 42vh; border: 1px solid var(--border-color); border-radius: 12px; margin-bottom: 10px; display: flex; flex-direction: column; overflow: hidden; background-color: rgba(255,255,255,0.01); }
        .chat-scroller { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 85%; padding: 10px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; }
        .bubble.ai { align-self: flex-start; background-color: var(--card-bg); border: 1px solid var(--border-color); border-left: 2px solid var(--accent-color); border-bottom-left-radius: 4px; }
        .bubble.user { align-self: flex-end; background-color: var(--toggle-bg); border: 1px solid var(--border-color); border-bottom-right-radius: 4px; }
        .voice-trigger-btn { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; background: rgba(13, 243, 150, 0.1); border: 1px solid rgba(13, 243, 150, 0.2); color: var(--accent-color); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .chat-input-bar { display: flex; gap: 8px; padding: 10px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); }
        .chat-input { flex: 1; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: #ffffff; padding: 10px; font-size: 13.5px; }
        .btn-send { background-color: var(--accent-color); color: #000; border: none; padding: 0 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }

        /* --- SYSTEM MONITOR TERMINAL --- */
        .telemetry-title { font-size: 10px; color: var(--text-muted); margin: 6px 0 4px 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .terminal-box { background-color: #050505; border-radius: 10px; border: 1px dashed var(--border-color); padding: 8px 10px; font-family: monospace; font-size: 11px; color: var(--accent-color); height: 75px; overflow-y: auto; line-height: 1.4; }

        /* --- 🏛️ ABSOLUTE TOP-LAYER FIXED BOTTOM NAV --- */
        .bottom-nav {
            position: fixed;
            /* สั่งถอยร่นขึ้นมาจากขอบล่างสุดเดิม 12px ป้องกันการจมลงไปมุดบาร์ระบบ iPad */
            bottom: 12px; 
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px); /* บีบด้านข้างให้แคบกว่าจอเพื่อทำทรงลอยนวลลบปัญหาขอบล้น */
            max-width: 416px;
            background-color: #0d0d0e;
            border: 1px solid var(--border-color);
            border-radius: 16px; /* ทำขอบมนให้ลอยเด่นเด่นแยกชิ้นชัดเจน */
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 12px 0;
            z-index: 99999; /* ให้สิทธิ์สูงสุดในการส่องสว่างเหนือระนาบพิกเซลใดๆ */
            box-shadow: 0 -4px 20px rgba(0,0,0,0.8);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 10px; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: var(--accent-color); }
        .nav-icon { font-size: 18px; }
    </style>
</head>
<body>

<div class="app-shell">
    
    <div class="stage-viewport">
        
        <!-- 🏠 HOME VIEW -->
        <div class="view active" id="view-Home">
            <div class="header">
                <div class="brand-wrapper"><div class="brand"><div class="brand-icon"></div><span id="txt-brandName">Off Grid AI</span></div><div class="pro-badge" id="txt-proBadge">PRO VERSION UNLOCKED</div></div>
                <div class="crown">👑</div>
            </div>
            <div class="card">
                <div class="card-header-text" id="txt-modelsHeader">Local Core Models (Premium Access)</div>
                <div class="models-grid">
                    <div class="model-item"><div class="model-val" id="txt-mText">💬 Q8_0</div><div class="model-lbl">Text</div></div>
                    <div class="model-item"><div class="model-val">🖼️ 1</div><div class="model-lbl">Vision</div></div>
                    <div class="model-item"><div class="model-val">🔊 1</div><div class="model-lbl">Audio</div></div>
                    <div class="model-item"><div class="model-val">🎙️ 1</div><div class="model-lbl">Speech</div></div>
                </div>
            </div>
            <button class="btn-action" id="txt-btnNewChat" onclick="routeTo('Chats')">New Chat (Unlimited Sandbox)</button>
