<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OFF-GRID AI KERNEL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border: 2px solid #00ffcc;
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2);
        }
        header {
            padding: 15px;
            border-bottom: 2px solid #00ffcc;
            background: rgba(0, 255, 204, 0.05);
            text-shadow: 0 0 8px #00ffcc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .quantum-glow {
            animation: pulse 2s infinite alternate;
        }
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.8);
            font-size: 14px;
            line-height: 1.5;
            border-bottom: 2px solid #00ffcc;
        }
        .log-entry {
            margin-bottom: 8px;
            border-left: 3px solid #ff007f;
            padding-left: 8px;
        }
        .success { border-left-color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
        .alert { border-left-color: #ffcc00; color: #ffcc00; text-shadow: 0 0 5px #ffcc00; }
        footer {
            height: 120px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #09090e;
        }
        button {
            background: transparent;
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: all 0.1s ease;
        }
        button:active {
            background: #00ffcc;
            color: #050508;
            box-shadow: 0 0 15px #00ffcc;
        }
        @keyframes pulse {
            from { text-shadow: 0 0 4px #00ffcc; }
            to { text-shadow: 0 0 12px #00ffcc, 0 0 20px #00ffcc; }
        }
    </style>
</head>
<body>

    <header>
        <div class="quantum-glow">📡 OFF-GRID AI KERNEL v1.0</div>
        <div id="hw-status" style="color: #ff007f;">STATUS: BOOTING...</div>
    </header>

    <main id="terminal-console">
        <div class="log-entry success">[SYSTEM]: ระบบ UI รูปแบบปิดนิ่งคงที่ (Stable Layout) Intialized...</div>
    </main>

    <footer>
        <button onclick="triggerEvent(4)">BIT 2<br>(Obstacle)</button>
        <button onclick="triggerEvent(2)">BIT 1<br>(Voice)</button>
        <button onclick="triggerEvent(1)">BIT 0<br>(Low Power)</button>
        <button onclick="triggerEvent(0)" style="color: #ff007f; border-color: rgba(255,0,127,0.3);">CLEAR<br>(Reset)</button>
    </footer>

    <script>
        const consoleEl = document.getElementById('terminal-console');
        const statusEl = document.getElementById('hw-status');
        let wasmInstance = null;

        // ----------------------------------------------------------------------
        // DATA SANITIZATION / BASE64 EMBEDDED KERNEL
        // สตริง Base64 ที่แปลงมาจากไฟล์ไบนารี .wasm บิตต่ำ (ผลลัพธ์จาก wasm-clang)
        // ----------------------------------------------------------------------
        const wasmBase64 = "AGFzbQEAAAABBgFgAX8BfwoGAQd/QX9qCgQBBgFwAAADBwIBYwADBAEGZgAGBw8BcHJvY2Vzc19sb2dpY19ldmVudAAACg4BAv8BAn4CfyMAIQAgAEGwtICABFoFAGYQACAAQbC0gIAEagshACAAQay0gIAEag4LIQACMAAhAAAMAAsQCg==";

        // ฟังก์ชันแปลงข้อความ Base64 ให้กลายเป็น Typed ArrayBuffer ดิบในหน่วยความจำ
        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        // กระบวนการโหลด WebAssembly แบบออฟไลน์ (Synchronous/Inline Loading)
        async function initWasm() {
            try {
                printLog("[SYSTEM]: กำลังถอดรหัสลอจิกสเปซบิตต่ำจาก Base64...", "success");
                const binaryData = base64ToArrayBuffer(wasmBase64);
                
                // บรรจุและลิงก์โมดูล Wasm โดยตรงในหน่วยความจำของเครื่อง
                const { instance } = await WebAssembly.instantiate(binaryData, {});
                wasmInstance = instance;
                
                statusEl.innerText = "STATUS: RUNNING (OFF-GRID)";
                statusEl.style.color = "#00ffcc";
                printLog("🎉 [SUCCESS]: WebAssembly Kernel ทำงานด้วยความเร็วแสงเรียบร้อยแล้ว!", "success");
            } catch (err) {
                statusEl.innerText = "STATUS: KERNEL ERROR";
                printLog(`❌ [ERROR]: เกิดความผิดพลาดในการบรรจุตรรกะระบบ: ${err.message}`, "alert");
            }
        }

        function printLog(message, type = "") {
            const timestamp = new Date().toLocaleTimeString();
            let newLog = document.createElement('div');
            newLog.className = 'log-entry ' + type;
            newLog.innerHTML = `[${timestamp}] ${message}`;
            consoleEl.appendChild(newLog);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // ฟังก์ชันสั่งงานระบบตามลอจิกเหตุและผล (Event-Driven Interaction Layer)
        function triggerEvent(bitValue) {
            if (!wasmInstance) {
                printLog("[WARNING]: รอให้ระบบประมวลผล Kernel เสร็จสิ้นก่อนส่งสัญญาณ", "alert");
                return;
            }

            if (bitValue === 0) {
                // ดับกระบวนการทำงานเพื่อคืนพลังงาน (Ceasing สู่สภาวะสงบ)
                const clearResult = wasmInstance.exports.process_logic_event(0);
                printLog(`[CEASING]: เคลียร์อินพุตบิต -> รีเซ็ตตรรกะต้นไม้พอยเตอร์กลับไปสู่สภาวะสงบ (Result Code: ${clearResult})`, "alert");
            } else {
                // กระตุ้นตามเหตุปัจจัย (Arising) ส่งผ่านค่าไปยัง Wasm C++ Core ผ่านทาง Bridge
                printLog(`[ARISING]: สัญญาณบิต [${bitValue}] เข้ากระทบตัวรับรู้หน้าจอ...`, "success");
                
                // เรียกใช้ฟังก์ชันประมวลผล O(1) ของ C++20 ต้นไม้พอยเตอร์โดยตรง
                const actionResult = wasmInstance.exports.process_logic_event(bitValue);
                
                printLog(`[PERSISTING]: เครื่องกรองตารางความจริงทำงานสำเร็จ -> ส่งคำสั่งผลลัพธ์บิตต่ำกลับ: ${actionResult}`, "success");
            }
        }

        // เริ่มต้นการบรรจุระบบทันทีที่เปิดแอปพลิเคชัน
        window.onload = initWasm;
    </script>
</body>
</html>
