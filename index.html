<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OFF-GRID AI KERNEL</title>
    <style>
        /* ล็อกทุกองค์ประกอบพื้นฐานตามมิติกายภาพหน้าจอ ไม่ให้ดริฟต์หรือเคลื่อนไหวเกินจำเป็น */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border: 2px solid #00ffcc;
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2);
        }

        /* ส่วนหัวแสดงผลระบบตัวรู้ (Status & Initialization Display) */
        header {
            padding: 15px;
            border-bottom: 2px solid #00ffcc;
            background: rgba(0, 255, 204, 0.05);
            text-shadow: 0 0 8px #00ffcc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quantum-glow {
            animation: pulse 2s infinite alternate;
        }

        /* ส่วนแสดงผลข้อมูลเหตุและผล (Console / Terminal View) */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.8);
            font-size: 14px;
            line-height: 1.5;
            border-bottom: 2px solid #00ffcc;
        }

        .log-entry {
            margin-bottom: 8px;
            border-left: 3px solid #ff007f;
            padding-left: 8px;
        }

        .success { border-left-color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
        .alert { border-left-color: #ffcc00; color: #ffcc00; text-shadow: 0 0 5px #ffcc00; }

        /* แผงปุ่มกดบิตต่ำสัมผัสถาวร โดยไม่ต้องพึ่งพาเมาส์ (Matrix Input Grid) */
        footer {
            height: 120px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #09090e;
        }

        button {
            background: transparent;
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: #00ffcc;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: all 0.1s ease;
        }

        button:active {
            background: #00ffcc;
            color: #050508;
            box-shadow: 0 0 15px #00ffcc;
        }

        @keyframes pulse {
            from { text-shadow: 0 0 4px #00ffcc; }
            to { text-shadow: 0 0 12px #00ffcc, 0 0 20px #00ffcc; }
        }
    </style>
</head>
<body>

    <header>
        <div class="quantum-glow">📡 OFF-GRID AI KERNEL v1.0</div>
        <div id="hw-status" style="color: #ff007f;">STATUS: INTIALIZED</div>
    </header>

    <main id="terminal-console">
        <div class="log-entry success">[SYSTEM]: การจองหน่วยความจำแบบนิ่งคงที่ (Fixed Memory) สำเร็จ..</div>
        <div class="log-entry success">[SYSTEM]: สถาปัตยกรรมเหตุปัจจัย Pointer Tree พร้อมประมวลผล..</div>
        <div class="log-entry alert">[WAITING]: รอรับสัญญาณบิตกระทบผ่านแผงสัมผัส (Event Input)..</div>
    </main>

    <!-- ปุ่มส่งสัญญาณลอจิกบิตต่ำเข้าสู่ระบบเครื่องกรองตารางความจริง -->
    <footer>
        <button onclick="triggerEvent(4)">BIT 2<br>(Obstacle)</button>
        <button onclick="triggerEvent(2)">BIT 1<br>(Voice)</button>
        <button onclick="triggerEvent(1)">BIT 0<br>(Low Power)</button>
        <button onclick="triggerEvent(0)" style="color: #ff007f; border-color: rgba(255,0,127,0.3);">CLEAR<br>(Reset)</button>
    </footer>

    <script>
        const consoleEl = document.getElementById('terminal-console');

        // ฟังก์ชันขับเคลื่อนตามระบบเหตุการณ์ (Event-driven Logic Interface)
        function triggerEvent(bitValue) {
            const timestamp = new Date().toLocaleTimeString();
            let newLog = document.createElement('div');
            newLog.className = 'log-entry';
            
            if (bitValue === 0) {
                newLog.className += ' alert';
                newLog.innerHTML = `[${timestamp}] [CEASING]: รีเซ็ตสภาวะระบบ ดับกระบวนการทำงานเพื่อประหยัดบิต`;
            } else {
                newLog.className += ' success';
                // ส่วนนี้จะใช้เชื่อมต่อส่ง ArrayBuffer ไปยังฟังก์ชัน evaluate_tree_logic ในไฟล์ .wasm ต่อไป
                newLog.innerHTML = `[${timestamp}] [ARISING]: สัญญาณบิต ${bitValue} เข้ากระทบระบบ -> ส่งผ่านตำแหน่งความเร็วแสงไปยัง Pointer Tree`;
            }
            
            consoleEl.appendChild(newLog);
            consoleEl.scrollTop = consoleEl.scrollHeight; // เลื่อนจอลงอัตโนมัติแบบเสถียร
        }
    </script>
</body>
</html>
