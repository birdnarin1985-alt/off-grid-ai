<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Off Grid AI - PRO VERSION (Full Matrix + Voice & Projects)</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0d0d0e;
            --border-color: #1a1a1c;
            --accent-color: #0df396; /* เขียวมินต์สะท้อนแสง */
            --pro-gold: #ffd60a;      /* ทองสิทธิ์โปร VIP */
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --text-dark: #3a3a3c;
            --toggle-bg: #1c1c1e;
            --input-bg: #151517;
            --chat-bubble-user: #1c1c1e;
            --chat-bubble-ai: #0d0d0e;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            position: relative;
            padding-bottom: 100px;
        }

        /* --- GPU Accelerated Viewport Stage --- */
        .stage-viewport {
            position: relative;
            width: 100%;
            min-height: 85vh;
            overflow: hidden;
            perspective: 1000px;
        }

        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            pointer-events: none;
            padding: 16px;
            will-change: transform, opacity;
            transform: translate3d(30px, 0, 0);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        .view.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate3d(0, 0, 0);
        }

        /* --- BASIC iOS STYLING --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .brand-wrapper { display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; }
        .brand-icon { width: 28px; height: 28px; border: 2px solid var(--accent-color); border-radius: 6px; position: relative; }
        .brand-icon::after { content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px; background-color: var(--accent-color); border-radius: 2px; }
        .pro-badge { background-color: rgba(13, 243, 150, 0.15); border: 1px solid var(--accent-color); color: var(--accent-color); font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 4px; margin-top: 4px; align-self: flex-start; }
        .crown-btn-active { width: 38px; height: 38px; background-color: rgba(255, 214, 10, 0.15); border: 1px solid var(--pro-gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--pro-gold); font-weight: bold; }
        
        .models-card, .pro-card, .recent-section, .appearance-card, .settings-list, .form-card, .project-card-item {
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; margin-bottom: 16px;
        }
        
        .models-grid { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
        .model-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .model-icon-row { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 500; }
        .model-label { font-size: 11px; color: var(--text-muted); }
        .btn-new-chat { width: 100%; background-color: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 500; cursor: pointer; margin-bottom: 16px; }
        .recent-item { background-color: #000; border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        
        h1.page-title { font-size: 32px; font-weight: 600; margin: 12px 0 24px 4px; }
        .back-nav-row { display: flex; align-items: center; gap: 8px; color: var(--accent-color); cursor: pointer; font-size: 16px; font-weight: 500; margin-bottom: 16px; }
        
        .settings-item { display: flex; align-items: flex-start; padding: 18px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
        .settings-item:last-child { border-bottom: none; }
        .item-icon { font-size: 20px; margin-right: 16px; width: 24px; text-align: center; }
        .item-content { flex: 1; }
        .item-title { font-size: 17px; font-weight: 500; margin-bottom: 4px; }
        .item-desc { font-size: 14px; color: var(--text-muted); line-height: 1.35; }
        .item-arrow { color: var(--text-dark); font-size: 18px; align-self: center; }

        /* --- CONTROL ELEMENT FORM --- */
        .form-group { margin-bottom: 20px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 500; margin-bottom: 8px; }
        .label-value { color: var(--accent-color); font-family: monospace; }
        .system-textarea, .input-text-field { width: 100%; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); padding: 12px; font-size: 14px; line-height: 1.4; resize: none; font-family: inherit; }
        .slider-input { width: 100%; -webkit-appearance: none; background: var(--toggle-bg); height: 6px; border-radius: 3px; outline: none; }
        .slider-input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--text-main); cursor: pointer; }
        
        .theme-selector, .precision-selector { background-color: var(--toggle-bg); padding: 2px; border-radius: 8px; display: flex; gap: 2px; }
        .theme-btn, .precision-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .theme-btn.active, .precision-btn.active { background-color: var(--accent-color); color: #000000; }

        /* iOS Switch Toggle */
        .switch-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--border-color); }
        .switch-row:last-child { border-bottom: none; }
        .switch-label { font-size: 16px; font-weight: 500; }
        .ios-switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .ios-switch input { opacity: 0; width: 0; height: 0; }
        .switch-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--toggle-bg); transition: .2s; border-radius: 34px; }
        .switch-slider::before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .switch-slider { background-color: var(--accent-color); }
        input:checked + .switch-slider::before { transform: translateX(20px); }

        /* --- 💬 INTERFACE: CHAT ROOM MODULE --- */
        .chat-container { display: flex; flex-direction: column; height: 62vh; background-color: #000; border-radius: 14px; border: 1px solid var(--border-color); overflow: hidden; }
        .chat-messages { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .chat-bubble { max-width: 85%; padding: 12px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
        .bubble-user { align-self: flex-end; background-color: var(--chat-bubble-user); border: 1px solid var(--border-color); color: var(--text-main); border-bottom-right-radius: 4px; }
        .bubble-ai { align-self: flex-start; background-color: var(--chat-bubble-ai); border: 1px solid var(--border-color); color: var(--text-main); border-bottom-left-radius: 4px; border-left: 2px solid var(--accent-color); }
        
        /* ปุ่มจำลองเสียงพรีเมียม */
        .voice-play-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; background: rgba(13, 243, 150, 0.1); border: 1px solid rgba(13, 243, 150, 0.2); color: var(--accent-color); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .voice-play-btn:active { background: rgba(13, 243, 150, 0.2); }
        
        .chat-input-bar { display: flex; gap: 8px; padding: 10px; background-color: var(--card-bg); border-top: 1px solid var(--border-color); }
        .btn-send { background-color: var(--accent-color); color: #000; border: none; padding: 0 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; }

        /* --- 📁 INTERFACE: PROJECTS LIST MODULE --- */
        .projects-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .btn-create-project { background-color: var(--toggle-bg); border: 1px solid var(--border-color); color: var(--accent-color); font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        .project-card-item { display: flex; justify-content: space-between; align-items: center; cursor: pointer; margin-bottom: 12px; }
