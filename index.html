<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Off Grid AI - Living PRO GPU Pixel Engine</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            background-color: #0d0d0e; /* กำหนดฐานกายหยาบให้เห็นพื้นที่ชัดเจน */
            box-shadow: 0 0 50px rgba(13, 243, 150, 0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

<canvas id="livingGpuCore"></canvas>

<script>
    // ========================================================
    // 🏛️ 1. CPU INITIALIZATION (ขั้นปฏิสนธิรูปนามและสเตตแอป)
    // ========================================================
    const canvas = document.getElementById('livingGpuCore');
    const ctx = canvas.getContext('2d');

    // มิติขนาดพิกเซลมาตรฐานสากล
    const V_WIDTH = 420;
    const V_HEIGHT = 740;

    let currentTab = 'Home'; 
    let modelTemperature = 0.7;
    let selectedQuant = "Q8_0"; 
    let ollamaActive = false;
    let aiResponseText = "ระบบตื่นรู้เต็มพิกเซล สัญญาณชีพจรรันบน GPU และวาดอักษรทึบแสงสว่างไสวแล้วครับ";
    
    let telemetryLogs = ["[BOOT] CPU initialized hardware boundaries.", "[PULSE] Sine-wave active on GPU frame buffer."];
    const clickTargets = []; 

    let localProjects = [
        { title: "Thai Legal Docs Translation", files: 12, desc: "สกัดและแปลข้อความกฎหมายออฟไลน์" },
        { title: "Data Sorting Pipeline", files: 4, desc: "จัดหมวดหมู่ไฟล์ผลสำรวจประจำภูมิภาค" }
    ];

    let pulseTime = 0;

    // ========================================================
    // 🎨 2. CONTINUOUS RENDERING LOOP (ลูปชีพจรวิ่วๆ สว่างไสวถาวร)
    // ========================================================
    function pulseEngineLoop() {
        pulseTime += 0.05; 
        
        // คำนวณคลื่นไซน์ควบคุมความสว่างนุ่มนวล (ขอบเขต 0.4 ถึง 1.0)
        const pulseAlpha = 0.7 + Math.sin(pulseTime) * 0.3;

        // เคลียร์พิกเซลพื้นหลังทุกเฟรมด้วยสีดำสนิททึบแสง ป้องกันเลเยอร์ซ้อนกันจนมืด
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
        clickTargets.length = 0; 

        // --- BACKGROUND GLOW MATRIX (แก้อาการมืดตึ๊บด้วยออร่าขอบจอ) ---
        ctx.strokeStyle = `rgba(13, 243, 150, ${0.1 + pulseAlpha * 0.1})`;
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, V_WIDTH - 4, V_HEIGHT - 4);
        ctx.lineWidth = 1;

        // --- 🟢 HEADER AREA ---
        ctx.fillStyle = `rgba(13, 243, 150, ${pulseAlpha})`;
        ctx.fillRect(24, 25, 18, 18);
        ctx.fillStyle = '#000000';
        ctx.fillRect(28, 29, 10, 10);
        ctx.fillStyle = '#0df396';
        ctx.fillRect(31, 32, 4, 4);

        // บังคับสไตล์อักษรให้หนาและทึบแสง 100% เสมอ (ขจัดปัญหาตัวอักษรจมหาย)
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('Off Grid AI', 52, 41);

        // ป้าย PRO VERSION UNLOCKED
        ctx.fillStyle = 'rgba(13, 243, 150, 0.15)';
        ctx.fillRect(24, 52, 140, 20);
        ctx.fillStyle = '#0df396';
        ctx.font = 'bold 10px monospace';
        ctx.fillText('PRO VERSION UNLOCKED', 32, 66);

        ctx.fillStyle = '#ffd60a'; 
        ctx.font = '18px sans-serif';
        ctx.fillText('👑', V_WIDTH - 42, 40);

        // --- 🎛️ VIEWPORT ROUTER MAPPING ---
        if (currentTab === 'Home') drawHomeGpuLayer(pulseAlpha);
        else if (currentTab === 'Chats') drawChatsGpuLayer(pulseAlpha);
        else if (currentTab === 'Projects') drawProjectsGpuLayer();
        else if (currentTab === 'Settings') drawSettingsGpuLayer(pulseAlpha);

        // --- 📊 DIAGNOSTICS CORE TERMINAL ---
        ctx.fillStyle = '#0d0d0e';
        ctx.strokeStyle = '#1a1a1c';
        ctx.fillRect(20, V_HEIGHT - 200, V_WIDTH - 40, 105);
        ctx.strokeRect(20, V_HEIGHT - 200, V_WIDTH - 40, 105);

        ctx.fillStyle = '#8e8e93';
        ctx.font = '11px monospace';
        ctx.fillText('Neural Engine Diagnostics (PRO MODE)', 28, V_HEIGHT - 210);

        ctx.fillStyle = '#0df396';
        ctx.font = '11px monospace';
        let logY = V_HEIGHT - 184;
        telemetryLogs.slice(-4).forEach(log => {
            ctx.fillText(log, 32, logY);
            logY += 16;
        });
        ctx.fillStyle = '#8e8e93';
        ctx.fillText(`[PULSE KERNEL] Wave Vector: ${Math.sin(pulseTime).toFixed(4)}`, 32, logY);

        // --- 🏠 BOTTOM NAVIGATION BAR MESH ---
        ctx.fillStyle = '#0d0d0e';
        ctx.fillRect(0, V_HEIGHT - 75, V_WIDTH, 75);
        ctx.fillStyle = '#1a1a1c';
        ctx.fillRect(0, V_HEIGHT - 75, V_WIDTH, 1); // เส้นขอบบนเด่นชัด

        const tabs = [
            { id: 'Home', icon: '🏠' },
            { id: 'Chats', icon: '💬' },
            { id: 'Projects', icon: '📁' },
            { id: 'Settings', icon: '⚙️' }
        ];
        const segWidth = V_WIDTH / tabs.length;

        tabs.forEach((t, i) => {
            const x = i * segWidth;
            const isSelected = currentTab === t.id;

            ctx.fillStyle = isSelected ? '#0df396' : '#8e8e93';
            ctx.font = '22px sans-serif';
            ctx.fillText(t.icon, x + (segWidth/2) - 11, V_HEIGHT - 42);
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText(t.id, x + (segWidth/2) - (ctx.measureText(t.id).width / 2), V_HEIGHT - 22);

            mapClickBox(x, V_HEIGHT - 75, segWidth, 75, () => {
                currentTab = t.id;
                pushLog(`[NAV] Tab switched to -> ${t.id}`);
            });
        });

        // สั่งกระแสเวทย์เรนเดอร์ GPU ต่อเนื่องแบบไร้รอยต่อ
        requestAnimationFrame(pulseEngineLoop);
    }

    // ========================================================
    // 🎨 3. LAYERS RENDERING FUNCTIONS (วาดวัตถุทึบสีสว่างตา)
    // ========================================================
    function drawHomeGpuLayer(pulseAlpha) {
        ctx.fillStyle = '#0d0d0e';
        ctx.strokeStyle = '#1a1a1c';
        ctx.fillRect(20, 95, V_WIDTH - 40, 60);
        ctx.strokeRect(20, 95, V_WIDTH - 40, 60);

        ctx.fillStyle = '#0df396';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(`💬 Text: ${selectedQuant}`, 34, 131);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('🖼️ Vision: Active', 150, 131);
        ctx.fillText('🔊 Audio: Unlocked', 275, 131);

        // ปุ่ม New Chat กะพริบขอบสว่างไสวมีมิติ
        ctx.fillStyle = '#0d0d0e';
        ctx.fillRect(20, 175, V_WIDTH - 40, 48);
        ctx.strokeStyle = `rgba(13, 243, 150, ${pulseAlpha})`;
        ctx.strokeRect(20, 175, V_WIDTH - 40, 48);
        
        ctx.fillStyle = '#0df396';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('New Chat (Unlimited Context Sandbox)', V_WIDTH/2 - 115, 204);

        mapClickBox(20, 175, V_WIDTH - 40, 48, () => {
            currentTab = 'Chats';
            executeHardwareInference("เปิดห้องแชทใหม่รุ่นโปร");
        });

        // กล่องคำตอบจำลอง
        ctx.fillStyle = '#0d0d0e';
        ctx.strokeStyle = '#1a1a1c';
        ctx.fillRect(20, 242, V_WIDTH - 40, 120);
        ctx.strokeRect(20, 242, V_WIDTH - 40, 120);
        ctx.fillStyle = '#8e8e93';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('🤖 คำตอบโต้ตอบล่าสุด (On-Device):', 34, 268);

        ctx.fillStyle = '#ffffff';
        ctx.font = '14px sans-serif';
        gpuTextWrap(aiResponseText, 34, 296, V_WIDTH - 68, 20);
    }

    function drawChatsGpuLayer(pulseAlpha) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('Interactive Chats Room', 24, 110);

        ctx.fillStyle = '#0d0d0e';
        ctx.strokeStyle = `rgba(13, 243, 150, ${pulseAlpha * 0.3})`;
        ctx.fillRect(20, 135, V_WIDTH - 40, 95);
        ctx.strokeRect(20, 135, V_WIDTH - 40, 95);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('👉 สัมผัสปุ่มนี้เพื่อส่งคำสั่ง "เช็ก System Status"', 36, 172);
        ctx.fillStyle = '#0df396';
        ctx.font = '11px monospace';
        ctx.fillText(`[PARAM] Temp: ${modelTemperature.toFixed(1)} | Precision: ${selectedQuant}`, 36, 200);

        mapClickBox(20, 135, V_WIDTH - 40, 95, () => {
            executeHardwareInference("เช็ก System Status ให้ฉันหน่อย");
        });

        ctx.fillStyle = '#0d0d0e';
        ctx.fillRect(20, 250, V_WIDTH - 40, 115);
        ctx.strokeRect(20, 250, V_WIDTH - 40, 115);
        ctx.fillStyle = '#0df396';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('🤖 Voice Audio Output:', 34, 275);
        ctx.fillStyle = '#ffffff';
        ctx.font = '14px sans-serif';
        gpuTextWrap(aiResponseText, 34, 302, V_WIDTH - 68, 20);
    }

    function drawProjectsGpuLayer() {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('Projects Ledger', 24, 110);

        ctx.fillStyle = '#1c1c1e';
        ctx.fillRect(V_WIDTH - 135, 90, 115, 26);
        ctx.fillStyle = '#0df396';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('+ Create Project', V_WIDTH - 120, 107);
        mapClickBox(V_WIDTH - 135, 90, 115, 26, () => {
            const randId = Math.floor(Math.random() * 900) + 100;
            localProjects.unshift({ title: `AI_Secure_Project_${randId}`, files: 1, desc: "จัดตั้งโฟลเดอร์บริบทออฟไลน์สำเร็จ" });
            pushLog(`[PROJECT] Created sandbox registry: ID ${randId}`);
        });

        let boxY = 135;
        localProjects.forEach(proj => {
            ctx.fillStyle = '#0d0d0e';
            ctx.strokeStyle = '#1a1a1c';
